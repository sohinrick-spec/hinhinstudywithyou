<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>軒軒陪你溫Bio</title>

  <!-- 🆕 防止瀏覽器快取 HTML，確保用戶每次拿到最新版本檢查邏輯 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      future: { hoverOnlyWhenSupported: true }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://unpkg.com/framer-motion@10.18.0/dist/framer-motion.umd.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; }
    .glass-panel {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .dark body { background-color: #111827; color: #f3f4f6; }
    .dark .glass-panel {
      background: rgba(31, 41, 55, 0.95);
      border: 1px solid rgba(75, 85, 99, 0.5);
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #c7c7c7; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    .dark .custom-scrollbar::-webkit-scrollbar-track { background: #1f2937; }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }
    body.logged-in #credential_picker_container,
    body.logged-in iframe[src*="accounts.google.com"],
    body.logged-in .S97_PB-IFa7d {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
      opacity: 0 !important;
    }
    @keyframes skeleton-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    .skeleton-pulse { animation: skeleton-pulse 1.4s ease-in-out infinite; }

    @keyframes progress-shine {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .progress-shine {
      background: linear-gradient(90deg,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,0.4) 50%,
        rgba(255,255,255,0) 100%);
      background-size: 200% 100%;
      animation: progress-shine 2s linear infinite;
    }

    @keyframes spin-once {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .spin-once { animation: spin-once 0.6s ease-in-out; }

    @keyframes bubble-pop {
      0%   { transform: scale(0); opacity: 0; }
      60%  { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .bubble-pop { animation: bubble-pop 0.4s ease-out; }
    @keyframes rainbow-border {
      0%   { border-color: #f87171; box-shadow: 0 0 0 2px #f87171; }
      16%  { border-color: #fb923c; box-shadow: 0 0 0 2px #fb923c; }
      33%  { border-color: #facc15; box-shadow: 0 0 0 2px #facc15; }
      50%  { border-color: #4ade80; box-shadow: 0 0 0 2px #4ade80; }
      66%  { border-color: #60a5fa; box-shadow: 0 0 0 2px #60a5fa; }
      83%  { border-color: #c084fc; box-shadow: 0 0 0 2px #c084fc; }
      100% { border-color: #f87171; box-shadow: 0 0 0 2px #f87171; }
    }
    @keyframes correct-flash {
      0%   { border-color: #4ade80; box-shadow: 0 0 0 3px #4ade80; }
      100% { border-color: transparent; box-shadow: none; }
    }
    .combo-border-correct {
      animation: correct-flash 0.6s ease-out forwards;
    }
    .combo-border-rainbow {
      animation: rainbow-border 1.5s linear infinite;
    }
  </style>
</head>
<body>
<div id="root"></div>

<!--
  ============================================================
  Source files — loaded in dependency order
  Edit the corresponding src/*.js file, not this index.html
  ============================================================

  src/version-check.js   — 版本檢查系統 (vanilla JS, runs immediately)
  src/config.js          — CONFIG, constants, SHOP_ITEMS, etc.
  src/utils.js           — Pure utility functions + image cache
  src/api.js             — GAS API service object
  src/toast.js           — Toast context + ToastProvider
  src/hooks.js           — All custom React hooks
  src/components.js      — Shared UI components + chart components
  src/screens.js         — StartScreen, FlashCard, Leaderboard,
                           Stats, WrongBook, Shop, Result screens
  src/assignment-screens.js — AssignmentAdminScreen,
                              AssignmentReportScreen
  src/daily-quest.js     — DailyQuestPanel component
  src/app.js             — BiologyFlashcardApp + Root + ReactDOM.render
  src/notification.js    — Daily 08:15 HKT push notification (vanilla JS)
-->

<!-- Version check — vanilla JS, must run before React boots -->
<script src="src/version-check.js"></script>

<!-- All React code compiled together by Babel standalone -->
<script type="text/babel" data-presets="react,env" src="src/config.js"></script>
<script type="text/babel" data-presets="react,env" src="src/utils.js"></script>
<script type="text/babel" data-presets="react,env" src="src/api.js"></script>
<script type="text/babel" data-presets="react,env" src="src/toast.js"></script>
<script type="text/babel" data-presets="react,env" src="src/hooks.js"></script>
<script type="text/babel" data-presets="react,env" src="src/components.js"></script>
<script type="text/babel" data-presets="react,env" src="src/screens.js"></script>
<script type="text/babel" data-presets="react,env" src="src/assignment-screens.js"></script>
<script type="text/babel" data-presets="react,env" src="src/daily-quest.js"></script>
<script type="text/babel" data-presets="react,env" src="src/app.js"></script>

<!-- Notification scheduler — vanilla JS, runs after page load -->
<script src="src/notification.js"></script>

</body>
</html>
