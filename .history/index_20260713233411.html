<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>軒軒陪你溫Bio</title>

  <!-- 🆕 防止瀏覽器快取 HTML，確保用戶每次拿到最新版本檢查邏輯 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    /* ============================================================
     * 🆕 [Stage A] 品牌換色 + 字體
     *   - indigo → 深青（主色）；purple → 深藍青（次色）
     *   - 只 remap 這兩個色階；green/red/amber/blue/pink/rose 全部保留預設
     *   - 全站現有 class（bg-indigo-600、from-indigo-500…）自動套用新色
     *   - 字體：拉丁字母 Space Grotesk，中文 fallback Noto Sans TC，等寬 JetBrains Mono
     * ============================================================ */
    tailwind.config = {
      darkMode: 'class',
      future: { hoverOnlyWhenSupported: true },
      theme: {
        extend: {
          fontFamily: {
            sans: ['Space Grotesk', 'Noto Sans TC', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace']
          },
          colors: {
            /* 主色：深青 (Deep Teal) — 取代原 indigo */
            indigo: {
              50:  '#eef7f7',
              100: '#d4ecec',
              200: '#a9d9da',
              300: '#74c0c2',
              400: '#40a3a6',
              500: '#1f8a8d',
              600: '#157175',
              700: '#135c60',
              800: '#144a4d',
              900: '#143d40',
              950: '#0a2426'
            },
            /* 次色：深藍青 (Deep Cerulean) — 取代原 purple；與主色形成協調漸層 */
            purple: {
              50:  '#eef4fb',
              100: '#d8e5f4',
              200: '#b4cce8',
              300: '#84aad8',
              400: '#5285c3',
              500: '#3468ab',
              600: '#26548f',
              700: '#204575',
              800: '#1e3b61',
              900: '#1c3352',
              950: '#111f34'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://unpkg.com/framer-motion@10.18.0/dist/framer-motion.umd.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    /* 🆕 [Stage A] 字體載入：Space Grotesk（拉丁/數字）+ JetBrains Mono（等寬）+ 原 Noto Sans TC（中文） */
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
    body { font-family: 'Space Grotesk', 'Noto Sans TC', sans-serif; }
    .glass-panel {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .dark body { background-color: #111827; color: #f3f4f6; }
    .dark .glass-panel {
      background: rgba(31, 41, 55, 0.95);
      border: 1px solid rgba(75, 85, 99, 0.5);
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #c7c7c7; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    .dark .custom-scrollbar::-webkit-scrollbar-track { background: #1f2937; }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }
    body.logged-in #credential_picker_container,
    body.logged-in iframe[src*="accounts.google.com"],
    body.logged-in .S97_PB-IFa7d {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
      opacity: 0 !important;
    }
    @keyframes skeleton-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    .skeleton-pulse { animation: skeleton-pulse 1.4s ease-in-out infinite; }

    @keyframes progress-shine {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .progress-shine {
      background: linear-gradient(90deg,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,0.4) 50%,
        rgba(255,255,255,0) 100%);
      background-size: 200% 100%;
      animation: progress-shine 2s linear infinite;
    }

    @keyframes spin-once {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .spin-once { animation: spin-once 0.6s ease-in-out; }

    @keyframes bubble-pop {
      0%   { transform: scale(0); opacity: 0; }
      60%  { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .bubble-pop { animation: bubble-pop 0.4s ease-out; }

    /* ============================================================
     * 🆕 [Stage A] 連擊簽名效果：暈開 / 發光 雙模式
     *   - combo-border-correct：3~4 連擊，綠色光暈綻放後淡出（bleed）
     *   - combo-border-rainbow：5+ 連擊，彩虹光暈持續繞邊（glow）
     * ============================================================ */
    @keyframes correct-glow {
      0%   { border-color: #22c55e; box-shadow: 0 0 20px 3px rgba(34,197,94,0.55); }
      60%  { border-color: #4ade80; box-shadow: 0 0 26px 5px rgba(74,222,128,0.35); }
      100% { border-color: transparent; box-shadow: 0 0 0 0 rgba(74,222,128,0); }
    }
    .combo-border-correct {
      animation: correct-glow 0.85s ease-out forwards;
    }

    @keyframes rainbow-glow {
      0%   { border-color: #f87171; box-shadow: 0 0 18px 3px rgba(248,113,113,0.55); }
      16%  { border-color: #fb923c; box-shadow: 0 0 18px 3px rgba(251,146,60,0.55); }
      33%  { border-color: #facc15; box-shadow: 0 0 18px 3px rgba(250,204,21,0.55); }
      50%  { border-color: #4ade80; box-shadow: 0 0 18px 3px rgba(74,222,128,0.55); }
      66%  { border-color: #22d3ee; box-shadow: 0 0 18px 3px rgba(34,211,238,0.55); }
      83%  { border-color: #818cf8; box-shadow: 0 0 18px 3px rgba(129,140,248,0.55); }
      100% { border-color: #f87171; box-shadow: 0 0 18px 3px rgba(248,113,113,0.55); }
    }
    .combo-border-rainbow {
      animation: rainbow-glow 1.6s linear infinite;
    }
  </style>
</head>
<body>
<div id="root"></div>

<!--
  ============================================================
  Source files — loaded in dependency order
  Edit the corresponding src/*.js file, not this index.html
  ============================================================

  src/version-check.js   — 版本檢查系統 (vanilla JS, runs immediately)
  src/config.js          — CONFIG, constants, SHOP_ITEMS, etc.
  src/utils.js           — Pure utility functions + image cache
  src/api.js             — GAS API service object
  src/toast.js           — Toast context + ToastProvider
  src/hooks.js           — All custom React hooks
  src/components.js      — Shared UI components + chart components
  src/screens.js         — StartScreen, FlashCard, Leaderboard,
                           Stats, WrongBook, Shop, Result screens
  src/assignment-screens.js — AssignmentAdminScreen,
                              AssignmentReportScreen
  src/daily-quest.js     — DailyQuestPanel component
  src/app.js             — BiologyFlashcardApp + Root + ReactDOM.render
  src/notification.js    — Daily 08:15 HKT push notification (vanilla JS)
-->

<!-- Version check — vanilla JS, must run before React boots -->
<script src="src/version-check.js"></script>

<!-- All React code compiled together by Babel standalone -->
<script type="text/babel" data-presets="react,env" src="src/config.js"></script>
<script type="text/babel" data-presets="react,env" src="src/utils.js"></script>
<script type="text/babel" data-presets="react,env" src="src/api.js"></script>
<script type="text/babel" data-presets="react,env" src="src/toast.js"></script>
<script type="text/babel" data-presets="react,env" src="src/hooks.js"></script>
<script type="text/babel" data-presets="react,env" src="src/components.js"></script>
<script type="text/babel" data-presets="react,env" src="src/screens.js"></script>
<script type="text/babel" data-presets="react,env" src="src/assignment-screens.js"></script>
<script type="text/babel" data-presets="react,env" src="src/daily-quest.js"></script>
<script type="text/babel" data-presets="react,env" src="src/app.js"></script>

<!-- Notification scheduler — vanilla JS, runs after page load -->
<script src="src/notification.js"></script>

</body>
</html>
